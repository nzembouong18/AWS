# Pipeline Terraform : plan sur PR (lecture seule), apply sur main (environnement protégé)
name: terraform
on:
  pull_request:
    paths: ["infra/**"]
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_DIR: infra/envs/prod
  AWS_REGION: eu-west-3

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=$TF_DIR fmt -check -recursive
      - run: terraform -chdir=$TF_DIR init -input=false
      - run: terraform -chdir=$TF_DIR validate
      - name: Scan de sécurité IaC
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          soft_fail: false
      - run: terraform -chdir=$TF_DIR plan -input=false -lock=false -out=tfplan   # -lock=false : le rôle plan est en lecture seule (pas de verrou DynamoDB)

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production        # approbation manuelle requise
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform -chdir=$TF_DIR init -input=false
      - run: terraform -chdir=$TF_DIR apply -input=false -auto-approve
